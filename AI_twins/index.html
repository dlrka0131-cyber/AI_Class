<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 닮은꼴 측정기</title>
    
    <!-- 깔끔한 프리텐다드(Pretendard) 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- 얼굴 인식 AI 로봇 두뇌 -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            margin: 0;
            padding: 15px;
            height: 100vh; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            gap: 15px; 
            overflow: hidden; 
            position: relative; 
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background-color: #ffffff;
            color: #ff6b81;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 3px solid #ff6b81;
            transition: all 0.2s ease;
            z-index: 100;
        }

        .home-btn:hover {
            background-color: #ff6b81;
            color: #ffffff;
            transform: scale(1.05);
        }
        
        h1 {
            color: #ffffff;
            font-size: 38px; 
            font-weight: 800;
            text-shadow: 2px 2px 0px #ff4757, 4px 4px 0px rgba(0,0,0,0.1);
            margin: 0;
        }

        #status-bar {
            font-size: 18px;
            font-weight: 700;
            color: #2f3542;
            padding: 10px 25px;
            background-color: #ffffff;
            border: 3px dashed #ff6b81;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #video-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 600px; 
            margin-bottom: 15px; 
        }

        #video-container {
            border: 8px solid #ffffff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-color: #2d3436;
            width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }





        .notice {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: rgba(255, 107, 129, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            margin: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 3,2,1 카운트다운 (카메라 위 가운데) */
        #countdown {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 160px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 6px 20px rgba(0,0,0,0.45);
            z-index: 20;
            pointer-events: none;
        }
        #countdown.pop { animation: pop 0.9s ease-out; }
        @keyframes pop {
            0%   { transform: scale(1.6); opacity: 0; }
            30%  { transform: scale(1);   opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* 찰칵! 하얀 번쩍임 */
        #flash {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            border-radius: 25px;
            z-index: 30;
            pointer-events: none;
        }
        #flash.on { animation: flash 0.4s ease-out; }
        @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

        /* 가운데에 뜨는 결과 카드 */
        #result-card {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background-color: #ffffff;
            border: 6px solid #ff4757;
            border-radius: 30px;
            padding: 25px 35px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
            max-width: 90%;
            animation: card-in 0.4s ease-out;
        }
        @keyframes card-in {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        #result-photo {
            max-height: 38vh;
            max-width: 100%;
            border-radius: 18px;
        }
        #result-text {
            font-size: 34px;
            font-weight: 800;
            color: #ff4757;
            line-height: 1.3;
        }

        /* 촬영하기 / 다시하기 버튼 */
        .action-btn {
            display: none;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .action-btn:hover { transform: scale(1.05); }
        .action-btn:disabled { background-color: #a4b0be; box-shadow: none; cursor: default; transform: none; }
        #retry-btn { background-color: #2ed573; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4); }

                #result-sub {
            font-size: 20px;
            font-weight: 700;
            color: #57606f;
            margin-top: -8px;
        }
    </style>
</head>
<body>

    <a href="../class2.html" class="home-btn">🏠 처음으로</a>

    <h1>👯 AI 눈에 우리는 얼마나 닮았을까? 👯</h1>
    
    <div id="status-bar">AI 마법사 소환 중... 🧙‍♂️ (잠시만 기다려주세요)</div>
    
    <div id="video-wrapper">
        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div id="countdown"></div>
        <div id="flash"></div>
    </div>

    <!-- 결과 카드 (촬영 후 가운데에 뜸) -->
    <div id="result-card">
        <canvas id="result-photo"></canvas>
        <div id="result-text"></div>
        <div id="result-sub"></div>
    </div>

    <button id="capture-btn" class="action-btn">📸 촬영하기</button>
    <button id="retry-btn" class="action-btn">🔄 다시하기</button>

    <div class="notice">💡 안내: 사진은 저장되지 않아요. AI가 숫자로만 비교하고 바로 지워요!</div>

    <script>
        const MODELS = [faceapi.nets.tinyFaceDetector, faceapi.nets.faceLandmark68Net, faceapi.nets.faceRecognitionNet];
        const READY_TEXT = "두 친구가 함께 화면에 나오게 하고 촬영 버튼을 눌러주세요! 👫";
        const resultSub = document.getElementById('result-sub');

        async function analyze(photo) {
            resultSub.innerText = "";
            const detections = await faceapi.detectAllFaces(photo, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks().withFaceDescriptors();
            if (!detections || detections.length < 2) {
                const found = detections ? detections.length : 0;
                return { text: `얼굴이 ${found}개만 보여요.\n두 명이 함께 나와야 해요! 👫`, color: "#57606f" };
            }
            // 가장 크게 보이는 얼굴 두 개 고르기
            const [a, b] = detections
                .sort((p, q) => q.detection.box.area - p.detection.box.area)
                .slice(0, 2)
                .sort((p, q) => p.detection.box.x - q.detection.box.x);

            // 사진 위에 비교한 두 얼굴 표시하기
            const ctx = photo.getContext('2d');
            [a, b].forEach((face, i) => {
                const box = face.detection.box;
                ctx.lineWidth = 6;
                ctx.strokeStyle = i === 0 ? "#ff4757" : "#1e90ff";
                ctx.strokeRect(box.x, box.y, box.width, box.height);
                ctx.fillStyle = ctx.strokeStyle;
                ctx.font = "bold 36px Pretendard, sans-serif";
                ctx.fillText(i === 0 ? "①" : "②", box.x + 6, box.y - 10);
            });

            // AI는 얼굴을 128개의 숫자로 바꿔요. 두 숫자 목록이 가까울수록 닮은 얼굴!
            const distance = faceapi.euclideanDistance(a.descriptor, b.descriptor);
            const similarity = Math.round(Math.max(0, Math.min(1, (1 - distance) / 0.7)) * 100);
            resultSub.innerText = `🔢 AI는 얼굴을 숫자 128개로 바꿔서 비교해요 (거리 ${distance.toFixed(2)})`;

            let comment = "완전 다른 매력! 🌈";
            if (similarity >= 70) comment = "혹시 쌍둥이?! 👯";
            else if (similarity >= 50) comment = "꽤 닮았어요! 😮";
            else if (similarity >= 30) comment = "살짝 닮은 구석이 있어요 🙂";
            return { text: `①②의 닮음 ${similarity}%\n${comment}`, color: "#1e90ff" };
        }

        const video = document.getElementById('video');
        const statusBar = document.getElementById('status-bar');
        const videoWrapper = document.getElementById('video-wrapper');
        const countdown = document.getElementById('countdown');
        const flash = document.getElementById('flash');
        const resultCard = document.getElementById('result-card');
        const resultPhoto = document.getElementById('result-photo');
        const resultText = document.getElementById('result-text');
        const captureBtn = document.getElementById('capture-btn');
        const retryBtn = document.getElementById('retry-btn');

        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // 1. AI 모델 불러오고 카메라 켜기
        async function startApp() {
            try {
                await Promise.all(MODELS.map(net => net.loadFromUri(MODEL_URL)));
                await analyze(document.createElement('canvas')); // 첫 분석이 느리지 않게 미리 한 번 실행
            } catch (err) {
                console.error(err);
                statusBar.innerText = "❌ AI 소환 실패! 인터넷 연결을 확인해 주세요.";
                return;
            }
            try {
                statusBar.innerText = "상단의 '카메라 허용'을 꼭 눌러주세요! 📷";
                video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                video.onloadedmetadata = () => {
                    statusBar.innerText = READY_TEXT;
                    captureBtn.style.display = "inline-block";
                };
            } catch (err) {
                console.error(err);
                statusBar.innerText = "❌ 카메라를 켤 수 없어요. 카메라 권한을 확인해 주세요 📷";
            }
        }

        // 2. 촬영하기: 3, 2, 1 → 찰칵! → 결과
        captureBtn.addEventListener('click', async () => {
            captureBtn.disabled = true;
            countdown.style.display = "flex";
            for (const n of [3, 2, 1]) {
                countdown.innerText = n;
                countdown.classList.remove('pop');
                void countdown.offsetWidth; // 애니메이션 다시 시작
                countdown.classList.add('pop');
                await sleep(1000);
            }
            countdown.style.display = "none";

            // 찰칵! (거울처럼 좌우 반전해서 사진 저장)
            flash.classList.remove('on');
            void flash.offsetWidth;
            flash.classList.add('on');
            resultPhoto.width = video.videoWidth;
            resultPhoto.height = video.videoHeight;
            const ctx = resultPhoto.getContext('2d');
            ctx.save();
            ctx.translate(resultPhoto.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            ctx.restore();

            statusBar.innerText = "🔮 AI가 사진을 분석하고 있어요...";
            const result = await analyze(resultPhoto);
            await sleep(400);

            // 카메라는 잠시 숨기고 결과 카드 보여주기
            resultText.innerText = result.text;
            resultText.style.color = result.color;
            resultCard.style.borderColor = result.color;
            videoWrapper.style.display = "none";
            captureBtn.style.display = "none";
            resultCard.style.display = "flex";
            retryBtn.style.display = "inline-block";
            statusBar.innerText = "✨ 결과가 나왔어요! ✨";
            captureBtn.disabled = false;
        });

        // 3. 다시하기: 결과 숨기고 카메라 다시 보이기
        retryBtn.addEventListener('click', () => {
            resultPhoto.width = resultPhoto.height = 0; // 찍은 사진 바로 지우기
            resultCard.style.display = "none";
            retryBtn.style.display = "none";
            videoWrapper.style.display = "flex";
            captureBtn.style.display = "inline-block";
            statusBar.innerText = READY_TEXT;
        });

        startApp();
    </script>
</body>
</html>
