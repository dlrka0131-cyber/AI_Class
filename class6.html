<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6차시: 문자 인식</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; word-break: keep-all; }
        body { font-family: 'Pretendard', sans-serif; background-color: #ebfbee; text-align: center; margin: 0; padding: 30px 20px 50px 20px; color: #212529; }
        .header-nav { max-width: 1050px; margin: 0 auto 20px auto; text-align: left; }
        .btn-home { font-family: 'Pretendard', sans-serif; display: inline-block; text-decoration: none; background-color: #ffffff; color: #212529; font-size: 1.2em; padding: 10px 20px; border-radius: 15px; border: 4px solid #212529; font-weight: 800; box-shadow: 4px 4px 0px #212529; transition: all 0.1s ease; }
        .btn-home:hover { background-color: #f8f9fa; }
        .btn-home:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #212529; }
        h1 { font-family: 'Pretendard', sans-serif; color: #212529; font-size: 3.5em; margin: 0 0 20px 0; font-weight: 900; text-shadow: 4px 4px 0px #ffe066; }
        .main-subtitle { font-family: 'Pretendard', sans-serif; font-size: 1.5em; margin: 0 0 50px 0; font-weight: 700; background-color: #ffffff; display: inline-block; padding: 12px 30px; border-radius: 30px; border: 3px solid #212529; box-shadow: 4px 4px 0px #212529; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1100px; margin: 0 auto; }
        .card { background-color: #ffffff; border-radius: 25px; border: 4px solid #212529; box-shadow: 6px 6px 0px #212529; width: 230px; padding: 30px 20px; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; position: relative; }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0px #212529; }
        .card-number { position: absolute; top: -15px; left: -15px; background-color: #ffe066; color: #212529; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Pretendard', sans-serif; font-size: 1.5em; font-weight: 900; border: 4px solid #212529; z-index: 2; }
        .icon-box { font-size: 3.5em; margin-top: 15px; margin-bottom: 20px; transition: transform 0.3s ease; }
        .card:hover .icon-box { transform: scale(1.1) rotate(5deg); }
        .card h2 { font-family: 'Pretendard', sans-serif; color: #212529; font-size: 1.3em; margin: 0 0 25px 0; font-weight: 800; text-align: center; line-height: 1.3; }
        .btn { font-family: 'Pretendard', sans-serif; display: inline-block; text-decoration: none; color: #212529; font-size: 1.1em; padding: 12px 0; border-radius: 15px; border: 3px solid #212529; width: 100%; font-weight: 800; margin-top: auto; box-shadow: 3px 3px 0px #212529; transition: all 0.1s ease; background-color: #e9ecef; }
        .btn:hover { background-color: #dee2e6; }
        .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #212529; }
    </style>
</head>
<body>
    <div class="header-nav"><a href="index.html" class="btn-home">🏠 처음으로</a></div>
    <h1 style="font-family: 'Pretendard', sans-serif;">🚧 6차시: 문자 인식</h1>
    <p class="main-subtitle" style="font-family: 'Pretendard', sans-serif;">오늘의 미션을 완수해 볼까요?</p>
    <div class="container">
        <div class="card">
            <div class="card-number" style="font-family: 'Pretendard', sans-serif;">1</div>
            <div class="icon-box">🤖🧹</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">클린봇 만들기</h2>
            <a href="cleanbot/index.html" class="btn" style="font-family: 'Pretendard', sans-serif;">GO!</a>
        </div>
        <div class="card">

            <div class="icon-box">⬜</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">내용을 채워주세요</h2>
            <a href="#" class="btn" style="font-family: 'Pretendard', sans-serif;">GO!</a>
        </div>
        <div class="card">

            <div class="icon-box">⬜</div>

            <a href="#" class="btn" style="font-family: 'Pretendard', sans-serif;">GO!</a>
        </div>

            <a href="#" class="btn" style="font-family: 'Pretendard', sans-serif;">GO!</a>
        </div>
    </div>
</body>
</html>
