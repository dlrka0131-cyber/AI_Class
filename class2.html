<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2차시: 티처블 머신</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { box-sizing: border-box; word-break: keep-all; }
        body { font-family: 'Pretendard', sans-serif; background-color: #e3fafc; text-align: center; margin: 0; padding: 30px 20px 50px 20px; color: #212529; }
        .header-nav { max-width: 1250px; margin: 0 auto 20px auto; text-align: left; }
        .btn-home { font-family: 'Pretendard', sans-serif; display: inline-block; text-decoration: none; background-color: #ffffff; color: #212529; font-size: 1.2em; padding: 10px 20px; border-radius: 15px; border: 4px solid #212529; font-weight: 800; box-shadow: 4px 4px 0px #212529; transition: all 0.1s ease; }
        .btn-home:hover { background-color: #f8f9fa; }
        .btn-home:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #212529; }
        h1 { font-family: 'Pretendard', sans-serif; color: #212529; font-size: 3.5em; margin: 0 0 20px 0; font-weight: 900; text-shadow: 4px 4px 0px #ffe066; }
        .main-subtitle { font-family: 'Pretendard', sans-serif; font-size: 1.5em; margin: 0 0 50px 0; font-weight: 700; background-color: #ffffff; display: inline-block; padding: 12px 30px; border-radius: 30px; border: 3px solid #212529; box-shadow: 4px 4px 0px #212529; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1300px; margin: 0 auto; }
        
        /* 카드 공통 스타일 */
        .card { background-color: #ffffff; border-radius: 25px; border: 4px solid #212529; box-shadow: 6px 6px 0px #212529; width: 230px; padding: 30px 20px; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; position: relative; }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0px #212529; }
        
        /* 카드별 포인트 컬러 테두리 추가 (옵션) */
        .card-ai-face { border-color: #ff4757; }
        .card-ai-face .card-number { background-color: #ff4757; color: white; border-color: #ff4757; }
        
        .card-ai-age { border-color: #ff9f43; }
        .card-ai-age .card-number { background-color: #ff9f43; color: white; border-color: #ff9f43; }

        .card-ai-mission { border-color: #a29bfe; }
        .card-ai-mission .card-number { background-color: #a29bfe; color: white; border-color: #a29bfe; }

        .card-ai-twins { border-color: #1e90ff; }
        .card-ai-twins .card-number { background-color: #1e90ff; color: white; border-color: #1e90ff; }

        .card-number { position: absolute; top: -15px; left: -15px; background-color: #ffe066; color: #212529; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Pretendard', sans-serif; font-size: 1.5em; font-weight: 900; border: 4px solid #212529; z-index: 2; }
        .icon-box { font-size: 3.5em; margin-top: 15px; margin-bottom: 20px; transition: transform 0.3s ease; }
        .card:hover .icon-box { transform: scale(1.1) rotate(5deg); }
        .card h2 { font-family: 'Pretendard', sans-serif; color: #212529; font-size: 1.3em; margin: 0 0 25px 0; font-weight: 800; text-align: center; line-height: 1.3; }
        
        .btn { font-family: 'Pretendard', sans-serif; display: inline-block; text-decoration: none; color: #212529; font-size: 1.1em; padding: 12px 0; border-radius: 15px; border: 3px solid #212529; width: 100%; font-weight: 800; margin-top: auto; box-shadow: 3px 3px 0px #212529; transition: all 0.1s ease; background-color: #e9ecef; }
        .btn:hover { background-color: #dee2e6; }
        .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #212529; }
        
        /* 버튼별 포인트 컬러 (옵션) */
        .btn-ai-face { background-color: #ffeaa7; }
        .btn-ai-face:hover { background-color: #fdcb6e; }
        .btn-ai-age { background-color: #fab1a0; }
        .btn-ai-age:hover { background-color: #e17055; }
        .btn-ai-mission { background-color: #d6d1ff; }
        .btn-ai-mission:hover { background-color: #a29bfe; }
        .btn-ai-twins { background-color: #c7ecff; }
        .btn-ai-twins:hover { background-color: #74b9ff; }
    </style>
</head>
<body>
    <div class="header-nav"><a href="index.html" class="btn-home">🏠 처음으로</a></div>
    <h1 style="font-family: 'Pretendard', sans-serif;">🚧 2차시: 티처블 머신</h1>
    <p class="main-subtitle" style="font-family: 'Pretendard', sans-serif;">오늘의 미션을 완수해 볼까요?</p>
    
    <div class="container">
        <!-- 1번: 티처블 머신 (기존) -->
        <div class="card">
            <div class="card-number" style="font-family: 'Pretendard', sans-serif;">1</div>
            <div class="icon-box">📸</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">티처블 머신</h2>
            <a href="https://teachablemachine.withgoogle.com/" target="_blank" class="btn" style="font-family: 'Pretendard', sans-serif;">GO!</a>
        </div>

        <!-- 2번: AI 성격 테스트 (추가) -->
        <div class="card card-ai-face">
            <div class="card-number" style="font-family: 'Pretendard', sans-serif;">2</div>
            <div class="icon-box">😆</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">내 성격 테스트<br><span style="font-size:0.7em; color:#7f8c8d;">(표정 인식)</span></h2>
            <a href="./AI_Face/index.html" class="btn btn-ai-face" style="font-family: 'Pretendard', sans-serif;">체험하기</a>
        </div>

        <!-- 3번: AI 나이 맞추기 (추가) -->
        <div class="card card-ai-age">
            <div class="card-number" style="font-family: 'Pretendard', sans-serif;">3</div>
            <div class="icon-box">👶</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">AI가 보는 내 나이<br><span style="font-size:0.7em; color:#7f8c8d;">(AI 속이기 미션)</span></h2>
            <a href="./AI_age/index.html" class="btn btn-ai-age" style="font-family: 'Pretendard', sans-serif;">체험하기</a>
        </div>

        <!-- 4번: AI 표정 미션 챌린지 -->
        <div class="card card-ai-mission">
            <div class="card-number" style="font-family: 'Pretendard', sans-serif;">4</div>
            <div class="icon-box">🎯</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">표정 미션 챌린지<br><span style="font-size:0.7em; color:#7f8c8d;">(AI 확신 점수)</span></h2>
            <a href="./AI_mission/index.html" class="btn btn-ai-mission" style="font-family: 'Pretendard', sans-serif;">체험하기</a>
        </div>

        <!-- 5번: AI 닮은꼴 측정기 -->
        <div class="card card-ai-twins">
            <div class="card-number" style="font-family: 'Pretendard', sans-serif;">5</div>
            <div class="icon-box">👯</div>
            <h2 style="font-family: 'Pretendard', sans-serif;">우리 얼마나 닮았을까?<br><span style="font-size:0.7em; color:#7f8c8d;">(얼굴을 숫자로)</span></h2>
            <a href="./AI_twins/index.html" class="btn btn-ai-twins" style="font-family: 'Pretendard', sans-serif;">체험하기</a>
        </div>
    </div>
</body>
</html>
