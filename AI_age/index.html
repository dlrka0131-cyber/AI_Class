<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마법 거울: 내 나이 맞추기</title>
    
    <!-- 깔끔한 프리텐다드(Pretendard) 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- 얼굴 인식 AI 로봇 두뇌 -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
    
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            margin: 0;
            padding: 15px;
            height: 100vh; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            gap: 15px; 
            overflow: hidden; 
            position: relative; 
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background-color: #ffffff;
            color: #ff6b81;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 3px solid #ff6b81;
            transition: all 0.2s ease;
            z-index: 100;
        }

        .home-btn:hover {
            background-color: #ff6b81;
            color: #ffffff;
            transform: scale(1.05);
        }
        
        h1 {
            color: #ffffff;
            font-size: 38px; 
            font-weight: 800;
            text-shadow: 2px 2px 0px #ff4757, 4px 4px 0px rgba(0,0,0,0.1);
            margin: 0;
        }

        #status-bar {
            font-size: 18px;
            font-weight: 700;
            color: #2f3542;
            padding: 10px 25px;
            background-color: #ffffff;
            border: 3px dashed #ff6b81;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #video-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 600px; 
            margin-bottom: 15px; 
        }

        #video-container {
            border: 8px solid #ffffff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-color: #2d3436;
            width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        /* 촬영하기 버튼 디자인 추가 */
        #capture-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
            font-family: inherit;
            display: none; /* 카메라 준비 전까지 숨김 */
            z-index: 20;
        }

        #capture-btn:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        #capture-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #result-box {
            position: absolute;
            bottom: -25px;
            background-color: #ffffff;
            padding: 15px 35px;
            border-radius: 40px;
            border: 5px solid #ff6b81;
            font-size: 26px;
            font-weight: 800;
            color: #ff4757;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
            z-index: 10;
            transition: all 0.2s ease-in-out;
        }

        .notice {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: rgba(255, 107, 129, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            margin: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <a href="../class2.html" class="home-btn">🏠 처음으로</a>

    <h1>✨ AI 마법 거울: 내 나이 맞추기 ✨</h1>
    
    <div id="status-bar">AI 마법사 소환 중... 🧙‍♂️ (잠시만 기다려주세요)</div>
    
    <div id="video-wrapper">
        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
        </div>
        <div id="result-box">얼굴을 보여주세요! 👀</div>
    </div>

    <!-- 촬영 버튼 추가 -->
    <button id="capture-btn">📸 촬영하기</button>

    <div class="notice">💡 안내: 빛이나 표정에 따라 나이가 다르게 나올 수 있어요!</div>

    <!-- AI 로직 자바스크립트 추가 -->
    <script>
        const video = document.getElementById('video');
        const statusBar = document.getElementById('status-bar');
        const resultBox = document.getElementById('result-box');
        const captureBtn = document.getElementById('capture-btn');

        // AI 모델이 저장된 주소 (필수)
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';

        // 1. 카메라 켜기 및 AI 준비
        async function startApp() {
            try {
                // 나이 인식과 얼굴 인식을 위한 AI 모델 불러오기
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL);
                
                // 웹캠 연결
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // 카메라가 켜지면 상태 메시지 변경하고 버튼 보이기
                video.onloadedmetadata = () => {
                    statusBar.innerText = "✨ AI 마법사 준비 완료! 촬영 버튼을 눌러주세요 ✨";
                    captureBtn.style.display = "block";
                };
            } catch (err) {
                console.error(err);
                statusBar.innerText = "카메라를 켤 수 없거나 모델을 불러오지 못했어요. 😢 권한을 확인해주세요.";
            }
        }

        // 2. 촬영하기 버튼을 눌렀을 때의 동작
        captureBtn.addEventListener('click', async () => {
            // 버튼 여러 번 누르는 것 방지
            captureBtn.disabled = true;
            
            // 3초 카운트다운
            resultBox.innerText = "분석중... 3초";
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            resultBox.innerText = "분석중... 2초";
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            resultBox.innerText = "분석중... 1초";
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            resultBox.innerText = "분석 완료!";
            await new Promise(resolve => setTimeout(resolve, 500));

            // 얼굴 인식 및 나이 분석 실행
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withAgeAndGender();
            
            if (detection) {
                // 소수점 나이를 반올림하여 정수로 만들기
                const age = Math.round(detection.age);
                resultBox.innerText = `짠! 당신의 AI 예측 나이는 ${age}살! 😲`;
            } else {
                resultBox.innerText = "얼굴을 찾을 수 없어요. 다시 시도해 주세요! 😅";
            }
            
            // 버튼 다시 활성화
            captureBtn.disabled = false;
        });

        // 웹페이지가 열리면 앱 시작
        startApp();
    </script>
</body>
</html>
